[custom]
; ==========================================================
; 精简版规则集
; 基于 Aethersailor 订阅转换模版
; - 🚀 节点选择 为主入口，包含所有策略与具体节点
; - ♻️ 自动选择 url-test 全局最优
; - 各地区 url-test 自动选本区最优
; - 应用统一走节点选择，Apple/Microsoft 默认直连
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗
; ==========================================================
exclude=到期|剩余流量|时间|官网|产品|流量|套餐|重置|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ==========================================================
; 策略组
; ==========================================================

; --- 主入口 ---
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]🧊 冷门节点`[]🎯 全球直连`.*

; --- 自动选择 ---
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

; --- 区域节点组 ---
custom_proxy_group=🇭🇰 香港节点`url-test`(🇭🇰|港|\bHK\b|Hong Kong|hongkong|深港|HKG)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(🇺🇸|美|\bUS\b|United States|洛杉矶|西雅图|纽约|LAX|SFO)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(🇯🇵|日本|\bJP\b|东京|大阪|Japan|NRT|TYO)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(🇸🇬|新加坡|\bSG\b|Singapore|狮城|SIN)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇼🇸 台湾节点`url-test`(🇹🇼|🇼🇸|台|\bTW\b|Taiwan|TPE)`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国节点`url-test`(🇰🇷|\bKR\b|Korea|首尔|韩|ICN)`https://cp.cloudflare.com/generate_204`300,,50

; --- 冷门节点（排除以上六区）---
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|港|\bHK\b|hong\s*kong|🇺🇸|美|\bUS\b|united\s*states|los\s*angeles|san\s*jose|seattle|new\s*york|🇯🇵|日本|\bJP\b|tokyo|osaka|🇸🇬|新加坡|\bSG\b|singapore|🇹🇼|🇼🇸|台|\bTW\b|taiwan|🇰🇷|\bKR\b|korea|seoul|首尔)).*

; --- 全球直连 ---
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; --- Apple（默认直连）---
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]🧊 冷门节点`.*

; --- Microsoft（默认直连）---
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]🧊 冷门节点`.*

; --- 漏网之鱼 ---
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🇰🇷 韩国节点`[]🧊 冷门节点`.*

; ==========================================================
; 规则
; ==========================================================

; 私网直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

; Aethersailor 规则集
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
ruleset=🚀 节点选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 节点选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800

; 国内直连
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; Apple / Microsoft
