[custom]
; ==========================================================
; OpenClash 规则集
; - 📡 代理总控 为主开关，包含所有策略组
; - 各地区组为 url-test，自动选本区最优
; - Apple / Microsoft 独立分组，默认直连
; ==========================================================

enable_rule_generator=true
overwrite_original_rules=true

; ==========================================================
; 节点清洗
; ==========================================================
exclude=流量|套餐|到期|剩余|重置|官网|网站|最新网址|防失联|失联|官网地址|公告|通知|TG|Telegram|电报|群|频道|说明|使用说明|QQ群|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Expire|Official|Website

; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================

; --- Adobe（可一键禁止联网）---
ruleset=🟥 Adobe,[]GEOSITE,adobe
ruleset=🟥 Adobe,[]GEOIP,adobe,no-resolve

; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁（兜底）---
ruleset=📡 代理总控,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=📡 代理总控,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games@cn
ruleset=DIRECT,[]GEOSITE,category-game-platforms-download
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- Apple（默认直连，可选代理）---
ruleset=🍎 Apple,[]GEOSITE,apple

; --- Microsoft（默认直连，可选代理）---
ruleset=🪟 Microsoft,[]GEOSITE,microsoft
ruleset=🪟 Microsoft,[]GEOIP,microsoft,no-resolve

; --- 应用统一走 代理总控（一个地方管所有）---
ruleset=📡 代理总控,[]GEOSITE,telegram
ruleset=📡 代理总控,[]GEOIP,telegram,no-resolve
ruleset=📡 代理总控,[]GEOSITE,openai
ruleset=📡 代理总控,[]GEOSITE,category-ai-!cn
ruleset=📡 代理总控,[]GEOSITE,youtube
ruleset=📡 代理总控,[]GEOSITE,netflix
ruleset=📡 代理总控,[]GEOIP,netflix,no-resolve
ruleset=📡 代理总控,[]GEOSITE,tiktok
ruleset=📡 代理总控,[]GEOIP,tiktok,no-resolve
ruleset=📡 代理总控,[]GEOSITE,instagram
ruleset=📡 代理总控,[]GEOSITE,twitter
ruleset=📡 代理总控,[]GEOSITE,github
ruleset=📡 代理总控,[]GEOIP,github,no-resolve
ruleset=📡 代理总控,[]GEOSITE,notion
ruleset=📡 代理总控,[]GEOIP,notion,no-resolve
ruleset=📡 代理总控,[]GEOSITE,category-speedtest
ruleset=📡 代理总控,[]GEOSITE,steam
ruleset=📡 代理总控,[]GEOSITE,cloudflare
ruleset=📡 代理总控,[]GEOIP,cloudflare,no-resolve
ruleset=📡 代理总控,[]GEOSITE,google
ruleset=📡 代理总控,[]GEOIP,google,no-resolve
ruleset=📡 代理总控,[]GEOSITE,category-communication
ruleset=📡 代理总控,[]GEOSITE,category-social-media-!cn
ruleset=📡 代理总控,[]GEOSITE,okx
ruleset=📡 代理总控,[]GEOSITE,binance
ruleset=📡 代理总控,[]GEOSITE,bybit

; --- GFW 兜底 ---
ruleset=📡 代理总控,[]GEOSITE,gfw

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL

; ==========================================================
; 2) 策略组
; ==========================================================

; --- 自动选择：url-test 全局最优 ---
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; --- 手动选择：只放具体节点，不包含地区组 ---
custom_proxy_group=🧭 手动选择`select`.*`[]DIRECT

; --- 区域节点组：url-test 自动选本区最优 ---
custom_proxy_group=🇭🇰 香港`url-test`(?i)(🇭🇰|香港|\\bHK\\b|hongkong)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇹🇼 台湾`url-test`(?i)(🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本`url-test`(?i)(🇯🇵|日本|\\bJP\\b|tokyo|osaka)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇰🇷 韩国`url-test`(?i)(🇰🇷|韩国|\\bKR\\b|korea|seoul)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡`url-test`(?i)(🇸🇬|新加坡|\\bSG\\b|singapore)`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国`url-test`(?i)(🇺🇸|美国|\\bUS\\b|united states|los angeles|san jose|seattle|new york)`http://www.gstatic.com/generate_204`300,,50

; --- 冷门节点（排除 HK/TW/JP/KR/SG/US）---
custom_proxy_group=🧊 冷门节点`select`(?i)^(?!.*(🇭🇰|香港|\\bHK\\b|hong\\s*kong|🇯🇵|日本|\\bJP\\b|tokyo|osaka|🇹🇼|台湾|\\bTW\\b|taiwan|taipei|hinet|🇰🇷|韩国|\\bKR\\b|korea|seoul|🇸🇬|新加坡|\\bSG\\b|singapore|🇺🇸|美国|\\bUS\\b|united\\s*states|los\\s*angeles|san\\s*jose|seattle|new\\s*york)).*

; --- 代理总控：主开关，包含所有策略组 ---
custom_proxy_group=📡 代理总控`select`[]♻️ 自动选择`[]🧭 手动选择`[]🇭🇰 香港`[]🇹🇼 台湾`[]🇯🇵 日本`[]🇰🇷 韩国`[]🇸🇬 新加坡`[]🇺🇸 美国`[]🧊 冷门节点`[]DIRECT

; --- Apple（默认直连，可选策略）---
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]📡 代理总控

; --- Microsoft（默认直连，可选策略）---
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]📡 代理总控

; --- Adobe（可一键禁止联网）---
custom_proxy_group=🟥 Adobe`select`[]REJECT`[]DIRECT`[]📡 代理总控

; --- 兜底 ---
custom_proxy_group=🐟 漏网之鱼`select`[]📡 代理总控`[]DIRECT`[]♻️ 自动选择`[]🧊 冷门节点
